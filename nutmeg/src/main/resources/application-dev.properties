nutmeg.seed.enabled=true
nutmeg.seed.league-name=Division 3
nutmeg.seed.country=England
nutmeg.seed.tier=3
nutmeg.seed.club-count=8
nutmeg.seed.admin-password=admin123

nutmeg.jwt.secret=dev-only-jwt-secret-key-at-least-32-characters-long
nutmeg.jwt.expiration-ms=86400000

spring.datasource.url=jdbc:h2:mem:nutmeg;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.username=sa
spring.datasource.password=

logging.level.org.springframework.security=DEBUG