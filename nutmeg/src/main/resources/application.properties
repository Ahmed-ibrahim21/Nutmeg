spring.application.name=nutmeg

# Use dev profile when running locally (seeds DB, keeps H2 schema in sync)
spring.profiles.active=dev

spring.datasource.url=jdbc:h2:mem:nutmeg;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console — browse seeded data at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.security=DEBUG